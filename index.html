<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Inimigos da Bola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111827; --text-dark: #d1d5db; --card-dark: #1f2937; --border-dark: #374151;
            --bg-light: #f3f4f6; --text-light: #1f2937; --card-light: #ffffff; --border-light: #e5e7eb;
        }
        html.dark { --bg-color: var(--bg-dark); --text-color: var(--text-dark); --card-color: var(--card-dark); --border-color: var(--border-dark); }
        html.light { --bg-color: var(--bg-light); --text-color: var(--text-light); --card-color: var(--card-light); --border-color: var(--border-light); }
        
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; transition: 0.3s; padding-bottom: 80px; }
        .card { background-color: var(--card-color); border: 1px solid var(--border-color); transition: 0.3s; }
        .tab-button.active { border-color: #3b82f6; color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }
        
        .modal { display: none; }
        .modal.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        /* Cores de Raridade */
        .rarity-comum { border-color: #9ca3af; color: #9ca3af; }
        .rarity-raro { border-color: #3b82f6; color: #3b82f6; }
        .rarity-epico { border-color: #a855f7; color: #a855f7; }
        .rarity-lendario { border-color: #f59e0b; color: #f59e0b; }
        .rarity-mitico { border: 2px solid; border-image-slice: 1; border-image-source: linear-gradient(to right, #f59e0b, #ef4444, #ec4899); color: #f59e0b; }

        /* Estilos do Campo de Futebol */
        .soccer-field {
            background: linear-gradient(to bottom, #1e3a8a, #172554);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        /* Linhas do campo (absolute positioning dentro do soccer-field) */
        .field-outline { position: absolute; top:0; left:0; right:0; bottom:0; border: 2px solid rgba(255,255,255,0.2); border-radius: 0.5rem; margin: 0.5rem; pointer-events: none; }
        .field-midline { position: absolute; top: 50%; left: 0.5rem; right: 0.5rem; height: 2px; background-color: rgba(255,255,255,0.2); transform: translateY(-50%); pointer-events: none; }
        .field-center-circle { position: absolute; top: 50%; left: 50%; width: 5rem; height: 5rem; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .field-box-top { position: absolute; top: 0.5rem; left: 50%; width: 40%; height: 15%; border: 2px solid rgba(255,255,255,0.2); border-top: none; transform: translateX(-50%); pointer-events: none; }
        .field-box-bottom { position: absolute; bottom: 0.5rem; left: 50%; width: 40%; height: 15%; border: 2px solid rgba(255,255,255,0.2); border-bottom: none; transform: translateX(-50%); pointer-events: none; }

        /* Cards FIFA Backgrounds */
        .bg-fifa-lenda { background: linear-gradient(135deg, #f59e0b, #b45309); color: white; }
        .bg-fifa-craque { background: linear-gradient(135deg, #e5e7eb, #9ca3af); color: black; }
        .bg-fifa-diferenciado { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .bg-fifa-esforcado { background: linear-gradient(135deg, #10b981, #047857); color: white; }
        .bg-fifa-iniciante { background: linear-gradient(135deg, #4b5563, #1f2937); color: white; }
    </style>
</head>
<body class="antialiased">

    <!-- Loading -->

<script>
    // 1. CONFIG
    const CONFIG = {
        sheetId: "1TvrVT8ksYYMlpw8gkKIFvpnnCf02J8uYTkhHc5c0vdo",
        apiKey: "AIzaSyCL19ds6YqVOv5vV-zygBjeC-byy-rDPfM",
        rangeJogadores: "Página1!A2:H100",
        rangePartidas: "Página2!A2:L1000" 
    };

    const PHOTOS = {
        "HENRIQUE AMARAL": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/henrique.jpg", "VITOR": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Vitor%20gol.jpg", "MARCO DAITX": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Marco.jpg", "EDUARDO DUDU": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Eduardo.jpg", "WILIAN SILVA": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Wilian%20Silva.jpg", "DOUGLAS DAITX": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Douglas.jpg", "GUSTAVO": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Gustavo.jpg", "ADEMIR": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Ademir.jpg", "DAVI": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Davi%20Mattos.jpg", "VICTOR MATHEUS": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Victor%20Matheus.jpg", "MATHEUS": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/matheus.jpg", "ANDRE": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/main/Andre.jpg", "MAICON": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Maicon.jpg", "CRISTIANO": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Cristiano.jpg", "CLAUDIO SCHNEIRDER": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Claudio.jpg", "WILIAN": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/main/Wiliam.jpg", "IAGO NUNES": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Iago%20Nunes.jpg", "WILLY": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/WILLY.jpg", "ZECA": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/ZECA.jpg", "FRANCISCO CHICO": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/FRANCISCO%20CHICO.jpg", "PEDRALLI": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/PEDRALLI.jpg", "THALES RAMOS": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Thales%20Ramos.jpg", "BRUNO GUIMARAES": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Bruno.jpg", "EVERTON": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Everton.jpg", "JUAREZ CARDOSO": "https://github.com/ittokki/Fotos-jogadores/blob/main/juarez.jpg?raw=true", "CARLOS ALEXANDRE": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Carlos%20alexandre.jpg"
    };

    let allPlayersData = [];
    let allMatchesData = [];
    let chartInstances = {};
    let comparisonChartInstance = null;

    // 2. HELPERS
    function parseNum(val) {
        if (typeof val === "number") return val;
        if (!val) return 0;
        return Number(val.toString().replace(',', '.').trim()) || 0;
    }

    function norm(nome) {
        if (!nome || typeof nome !== 'string') return '';
        return nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").replace(/\(GOL\)/gi, "").trim().toUpperCase();
    }

    function format(v, t) {
        if (v === undefined || v === null || isNaN(v)) return '-';
        if (t === 'pct') return v.toFixed(0) + '%';
        if (t === 'dec') return v.toFixed(1);
        return Math.round(v);
    }

    function mapPosition(pos) {
        if (!pos || typeof pos !== 'string') return 'N/A';
        const p = pos.toLowerCase().trim();
        if (p.includes('ata')) return 'ata';
        if (p.includes('mei')) return 'mei';
        if (p.includes('ala')) return 'ala';
        if (p.includes('zag')) return 'zag';
        if (p.includes('gol')) return 'gol';
        return 'N/A';
    }

    function getMonthLabel(dateStr) {
        const [m, y] = dateStr.split('/');
        const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        return `${months[parseInt(m)-1]} ${y}`;
    }

    // 3. DATA LOAD
    async function loadData() {
        try {
            const f1 = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetId}/values/${CONFIG.rangePartidas}?key=${CONFIG.apiKey}`);
            const f2 = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetId}/values/${CONFIG.rangeJogadores}?key=${CONFIG.apiKey}`);
            
            if(!f1.ok || !f2.ok) throw new Error("Erro API");
            
            const pData = await f1.json();
            const jData = await f2.json();
            
            processarDados(pData.values, jData.values);
            initUI();
        } catch(e) {
            console.error(e);
            document.getElementById('loading').style.display = 'none';
            alert("Erro ao carregar dados.");
        }
    }

    // 4. LOGIC
    function calcularNotaPartida(dados) {
        const isGoleiro = dados.isGoleiro;
        const PESO_ADM = 5;
        const PESO_GOLS = 0.7;
        const PESO_ASSIST = 0.6;
        const PESO_GOLS_TOMADOS = isGoleiro ? -0.15 : 0;
        const PESO_GOLS_CONTRA = -0.7;
        const NOTA_BASE = 6.0;

        const notaTecnica = NOTA_BASE + (dados.gols * PESO_GOLS) + (dados.assistencias * PESO_ASSIST) + (dados.golsTomados * PESO_GOLS_TOMADOS) + (dados.golsContra * PESO_GOLS_CONTRA);
        let notaPonderada = (notaTecnica + (dados.notaADM * PESO_ADM)) / (1 + PESO_ADM);
        const bonusResultado = dados.vitoria === 1 ? 0.3 : (dados.vitoria === 0.5 ? 0.15 : 0);
        return Math.max(0, Math.min(10, Math.round((notaPonderada + bonusResultado) * 10) / 10));
    }

    function calcularConquistas(jogador, partidasJogador) {
        const conquistas = [];
        if(!partidasJogador) return [];
        partidasJogador.forEach(p => {
            if (p.gols >= 6) conquistas.push({ nome: "Exterminador", desc: `6 gols em ${p.dataJogo}`, icon: "fa-skull-crossbones", rarity: "mitico" });
            else if (p.gols >= 5) conquistas.push({ nome: "Repoker", desc: `5 gols em ${p.dataJogo}`, icon: "fa-star", rarity: "lendario" });
            else if (p.gols >= 4) conquistas.push({ nome: "Pôquer", desc: `4 gols em ${p.dataJogo}`, icon: "fa-dice-four", rarity: "epico" });
            else if (p.gols >= 3) conquistas.push({ nome: "Hat-Trick", desc: `3 gols em ${p.dataJogo}`, icon: "fa-futbol", rarity: "raro" });
            else if (p.gols >= 2) conquistas.push({ nome: "Doblete", desc: `2 gols em ${p.dataJogo}`, icon: "fa-person-running", rarity: "comum" });

            if (p.assistencias >= 6) conquistas.push({ nome: "Maestro", desc: `6+ assistências em ${p.dataJogo}`, icon: "fa-theater-masks", rarity: "mitico" });
            else if (p.assistencias >= 5) conquistas.push({ nome: "5 Assistências", desc: `5 assist. em ${p.dataJogo}`, icon: "fa-crown", rarity: "lendario" });
            else if (p.assistencias >= 4) conquistas.push({ nome: "4 Assistências", desc: `4 assistências em ${p.dataJogo}`, icon: "fa-brain", rarity: "epico" });
            else if (p.assistencias >= 3) conquistas.push({ nome: "Hat-Trick de Assist.", desc: `3 assist. em ${p.dataJogo}`, icon: "fa-hat-wizard", rarity: "raro" });
            else if (p.assistencias >= 2) conquistas.push({ nome: "2 Assistências", desc: `2 assistências em ${p.dataJogo}`, icon: "fa-hands-helping", rarity: "comum" });

            if (p.notaPartida >= 9.5) conquistas.push({ nome: "Lenda do Jogo", desc: `Nota ${p.notaPartida}`, icon: "fa-gavel", rarity: "lendario" });
            else if (p.notaPartida >= 9) conquistas.push({ nome: "Partida Épica", desc: `Nota ${p.notaPartida}`, icon: "fa-meteor", rarity: "epico" });
        });
        if (jogador.jogos >= 25) conquistas.push({ nome: "Veterano", desc: "25 partidas", icon: "fa-shield-halved", rarity: "raro" });
        if (jogador.vitorias >= 10) conquistas.push({ nome: "Campeão", desc: "10 vitórias", icon: "fa-trophy", rarity: "raro" });
        return conquistas;
    }

    function processarDados(partidasRaw, jogadoresRaw) {
        const jMap = new Map();
        jogadoresRaw.forEach(r => {
            const n = norm(r[1]);
            if(n) jMap.set(n, { id: r[0], nome: n, nomeOriginal: r[1] });
        });

        const dateRegex = /^\d{2}\/\d{2}\/\d{4}$/;
        allMatchesData = partidasRaw.map(r => {
            const vit = (r[7]||"").toLowerCase().trim();
            const isG = (r[0]||"").toUpperCase().includes('(GOL)') || parseNum(r[3]) > 0;
            
            const obj = {
                nome: norm(r[0]), nomeRaw: r[0],
                gols: parseNum(r[1]), assistencias: parseNum(r[2]),
                golsTomados: parseNum(r[3]), golsContra: parseNum(r[4]),
                notaADM: parseNum(r[5]), dataJogo: r[6],
                vitoria: vit === 'sim' ? 1 : (vit === 'empate' ? 0.5 : 0),
                time: r[8] || 'N/A', jogoAconteceu: (r[10]||"").toLowerCase() === 'sim',
                isGoleiro: isG, posicao: mapPosition(r[11])
            };
            obj.notaPartida = obj.jogoAconteceu ? calcularNotaPartida(obj) : 0;
            return obj;
        }).filter(p => p.nome && dateRegex.test(p.dataJogo));

        // Seleção da Semana (Contagem)
        const selCounts = new Map();
        const byWeek = allMatchesData.reduce((acc,p) => { if(p.jogoAconteceu) (acc[p.dataJogo] = acc[p.dataJogo] || []).push(p); return acc; }, {});
        
        Object.values(byWeek).forEach(weekP => {
            const best = (pos,n) => weekP.filter(p=>p.posicao===pos).sort((a,b)=>b.notaPartida-a.notaPartida).slice(0,n);
            const team = [...best('ata',2), ...best('mei',1), ...best('ala',2), ...best('zag',1), ...best('gol',1)];
            team.forEach(p => { if(p) selCounts.set(p.nome, (selCounts.get(p.nome)||0)+1); });
        });

        // Agregar Stats
        allPlayersData = recalculateStats(Array.from(jMap.values()), allMatchesData);
        allPlayersData.forEach(p => {
            p.timeDaSemanaCount = selCounts.get(p.nome) || 0;
            if(p.timeDaSemanaCount > 0) {
                p.conquistas.unshift({nome: `${p.timeDaSemanaCount}x Seleção`, desc: "Na seleção da semana", icon: "fa-award", rarity: "raro"});
            }
        });
    }

    function recalculateStats(baseList, matches) {
        const map = new Map();
        baseList.forEach(p => map.set(p.nome, { ...p, jogos:0, vitorias:0, empates:0, gols:0, assistencias:0, golsTomados:0, partidas:[], notasGeral:[], notasGoleiro:[] }));

        matches.filter(m => m.jogoAconteceu).forEach(m => {
            if(map.has(m.nome)) {
                const p = map.get(m.nome);
                p.jogos++;
                if(m.vitoria === 1) p.vitorias++;
                if(m.vitoria === 0.5) p.empates++;
                p.gols += m.gols;
                p.assistencias += m.assistencias;
                p.golsTomados += m.golsTomados;
                p.partidas.push(m);
                p.notasGeral.push(m.notaPartida);
                if(m.isGoleiro) p.notasGoleiro.push(m.notaPartida);
            }
        });

        const res = Array.from(map.values()).filter(p => p.jogos > 0);
        res.forEach(p => {
            p.notaGeral = p.notasGeral.length ? p.notasGeral.reduce((a,b)=>a+b,0)/p.notasGeral.length : 0;
            p.jogosGoleiro = p.notasGoleiro.length;
            p.mediaGolsSofridos = p.jogosGoleiro ? p.golsTomados/p.jogosGoleiro : 0;
            p.aproveitamento = ((p.vitorias + p.empates*0.5)/p.jogos)*100;
            p.conquistas = calcularConquistas(p, p.partidas);
            
            const cnt = {};
            p.partidas.forEach(m => cnt[m.posicao] = (cnt[m.posicao]||0)+1);
            p.posicaoPrimaria = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || 'N/A';

            if(p.notaGeral >= 9) p.nivel = 'Lenda';
            else if(p.notaGeral >= 8) p.nivel = 'Craque';
            else if(p.notaGeral >= 7) p.nivel = 'Diferenciado';
            else if(p.notaGeral >= 6) p.nivel = 'Esforçado';
            else p.nivel = 'Iniciante';
        });
        return res;
    }

    function calculateFifaStats(p) {
        const all = allPlayersData;
        const maxG = Math.max(...all.map(x=>x.gols)) || 1;
        const maxA = Math.max(...all.map(x=>x.assistencias)) || 1;
        const maxJ = Math.max(...all.map(x=>x.jogos)) || 1;
        
        const scale = (v,m) => Math.min(99, Math.max(40, Math.round((v/m)*99)));
        
        let pac;
        let sho;
        let pas;
        let dri;
        let def;
        let phy;

        const activityScore = (p.jogos / maxJ) * 60;
        const outputScore = ((p.gols + p.assistencias) / (maxG + maxA)) * 40;
        pac = Math.round(activityScore + outputScore);
        if(p.posicaoPrimaria.match(/ala|ata/)) pac += 5;
        
        // SHO: Lógica corrigida (Média)
        const mediaGols = p.gols / p.jogos;
        if (mediaGols >= 1.5) sho = 99;
        else if (mediaGols >= 1.0) sho = 90 + ((mediaGols-1.0) * 18);
        else sho = scale(p.gols, maxG);

        pas = Math.round(((p.assistencias/maxA)*70) + ((p.notaGeral/10)*30));
        dri = Math.round(((p.notaGeral/10)*50) + (((p.gols+p.assistencias)/(maxG+maxA))*50));
        def = (p.posicaoPrimaria.match(/gol|zag/)) ? Math.round((p.notaGeral/10)*90) : Math.round((p.jogos/maxJ)*50);
        phy = scale(p.jogos, maxJ);

        const clamp = v => Math.min(99, Math.max(40, v));
        return { PAC:clamp(pac), SHO:clamp(sho), PAS:clamp(pas), DRI:clamp(dri), DEF:clamp(def), PHY:clamp(phy) };
    }

    function initUI() {

            const [mb, yb] = b.split('/').map(Number);

    function updateRankings(month, search='') {
        let list = allPlayersData;
        if(month !== 'all' && month !== 'Geral') {
            const matches = allMatchesData.filter(m => m.dataJogo.slice(3) === month);
            list = recalculateStats(allPlayersData, matches);
        }
        if(search) list = list.filter(p => p.nome.includes(norm(search)));
        
        renderRankings(list);
        renderDestaqueDoMes(list, month === 'all' || month === 'Geral' ? 'Geral' : getMonthLabel(month));
    }

        const container = document.getElementById('rankings-grid');

            { title: 'Gols', key: 'gols' },

            { title: 'Vitórias', key: 'vitorias' },

    function createRankingCard(title, data, key, unit = '', higherIsBetter = true) {
        const sortedData = [...data].sort((a, b) => higherIsBetter ? b[key] - a[key] : a[key] - b[key]);
        const top5 = sortedData.slice(0, 5);
        let html = `<div class="card p-4 rounded-lg flex flex-col fade-in"><h3 class="font-bold text-lg mb-4">${title}</h3><div class="flex-grow space-y-3">`;
        if (top5.length === 0) {
             html += `<p class="text-gray-500 text-sm h-full flex items-center justify-center">Nenhum jogador encontrado.</p>`;
        } else {
            top5.forEach((p, index) => {
                const value = format(p[key], key==='notaGeral'||key==='mediaGolsSofridos'?'dec':(unit==='%'?'pct':''));
                const photoUrl = PHOTOS[p.nome] || `https://ui-avatars.com/api/?name=${p.nome.replace(' ', '+')}&background=random`;
                html += `
                    <div class="player-card flex items-center cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-md" data-player-name="${p.nomeOriginal}">
                        <span class="font-bold w-6">${index + 1}.</span>
                        <img src="${photoUrl}" class="w-10 h-10 rounded-full object-cover mr-3" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${p.nome.replace(' ', '+')}&background=random';">
                        <div class="flex-grow player-info">
                            <p class="font-semibold truncate leading-tight">${p.nomeOriginal}</p>
                        </div>
                        <span class="font-bold text-blue-500">${value}${unit}</span>
                    </div>
                `;
            });
        }
        html += `</div><button class="ver-mais-btn mt-4 text-sm text-blue-500 hover:underline" onclick="openFullRanking('${title}', '${key}', '${unit}', ${key==='mediaGolsSofridos'})">Ver Ranking Completo</button></div>`;
        return html;
    }

        const build = (id, type, title, fn, color) => {
            const s = [...p].sort(fn).slice(0,10);
            if(chartInstances[id]) chartInstances[id].destroy();
            chartInstances[id] = new Chart(document.getElementById(id), {
                type, data: { labels: s.map(x=>x.nomeOriginal), datasets: [{ label: title, data: s.map(x=>x._val), backgroundColor: color }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: title } } }
            });
        };

        p.forEach(x=>x._val=x.gols); build('chart-gols', 'bar', 'Gols', (a,b)=>b.gols-a.gols, '#3b82f6');
        p.forEach(x=>x._val=x.assistencias); build('chart-assists', 'bar', 'Assistências', (a,b)=>b.assistencias-a.assistencias, '#10b981');
        p.forEach(x=>x._val=x.aproveitamento); build('chart-aprov', 'bar', 'Aproveitamento %', (a,b)=>b.aproveitamento-a.aproveitamento, '#f59e0b');
        
        // Evolução
        const evo = p.map(x => {
            const m = x.partidas.filter(j=>j.jogoAconteceu);
            return { ...x, val: m.length >= 3 ? m[m.length-1].notaPartida - m[m.length-3].notaPartida : -99 };
        }).filter(x=>x.val > -10).sort((a,b)=>b.val-a.val).slice(0,10);
        
        evo.forEach(x=>x._val=x.val);
        build('chart-evolucao', 'bar', 'Evolução Recente', (a,b)=>b.val-a.val, '#8b5cf6');

        // Monthly
        const monthlyGoals = allMatchesData.filter(p => p.jogoAconteceu).reduce((acc, p) => { acc[p.dataJogo.slice(3)] = (acc[p.dataJogo.slice(3)]||0)+p.gols; return acc; }, {});
        const ctxM = document.getElementById('chart-monthly').getContext('2d');
        if(chartInstances['chart-monthly']) chartInstances['chart-monthly'].destroy();
        chartInstances['chart-monthly'] = new Chart(ctxM, { type: 'line', data: { labels: Object.keys(monthlyGoals), datasets: [{ label: 'Gols', data: Object.values(monthlyGoals), borderColor: '#ec4899', tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    // --- GLOBAL ACTIONS ---
    window.switchTab = (id) => {
        document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll(`[onclick="switchTab('${id}')"]`).forEach(b => b.classList.add('active'));
        if(id === 'graficos') renderCharts();
    };
    window.closeModal = (id) => document.getElementById(id).classList.remove('show');
    
    window.openPlayerModal = (name) => {
        const p = allPlayersData.find(x => x.nomeOriginal === name);
        if(!p) return;
        const stats = calculateFifaStats(p);
        const bg = p.nivel==='Lenda' ? 'bg-fifa-lenda' : (p.nivel==='Craque'?'bg-fifa-craque':'bg-fifa-comum');
        
        document.getElementById('player-modal-content').innerHTML = `
            <div class="flex flex-col md:flex-row gap-6 bg-gray-900 p-6 rounded-xl">
                <div class="w-64 h-96 ${bg} rounded-[1.5rem] relative flex flex-col items-center p-4 shadow-2xl mx-auto text-current select-none">
                    <div class="absolute top-6 left-6 text-left leading-none"><div class="text-4xl font-bold">${p.notaGeral.toFixed(0)}</div><div class="text-xs uppercase">OVR</div></div>
                    <img src="${PHOTOS[p.nome]||''}" class="w-32 h-32 rounded-full object-cover mt-8 border-2 border-white/30 bg-gray-800">
                    <!-- CORREÇÃO: NOME COMPLETO CENTRALIZADO -->
                    <div class="mt-4 text-xl font-bold uppercase border-b border-white/30 pb-1 mb-2 text-center w-full leading-tight break-words px-2">${p.nomeOriginal}</div>
                    <div class="grid grid-cols-2 w-full px-4 text-sm font-bold">
                        <div class="flex justify-between"><span>PAC</span><span>${stats.PAC}</span></div>
                        <div class="flex justify-between"><span>DRI</span><span>${stats.DRI}</span></div>
                        <div class="flex justify-between"><span>SHO</span><span>${stats.SHO}</span></div>
                        <div class="flex justify-between"><span>DEF</span><span>${stats.DEF}</span></div>
                        <div class="flex justify-between"><span>PAS</span><span>${stats.PAS}</span></div>
                        <div class="flex justify-between"><span>PHY</span><span>${stats.PHY}</span></div>
                    </div>
                </div>
                <div class="flex-1 text-white">
                    <h2 class="text-3xl font-bold">${p.nomeOriginal}</h2>
                    <p class="text-blue-400 font-bold mb-4 uppercase">${p.nivel}</p>
                    <div class="grid grid-cols-3 gap-4 mb-6 text-center">
                        <div class="bg-gray-800 p-3 rounded"><div class="text-2xl font-bold">${p.jogos}</div><div class="text-xs text-gray-400">Jogos</div></div>
                        <div class="bg-gray-800 p-3 rounded"><div class="text-2xl font-bold text-blue-400">${p.gols}</div><div class="text-xs text-gray-400">Gols</div></div>
                        <div class="bg-gray-800 p-3 rounded"><div class="text-2xl font-bold text-green-400">${p.assistencias}</div><div class="text-xs text-gray-400">Assist</div></div>
                    </div>
                    <h3 class="font-bold mb-2 text-yellow-500">Conquistas (${p.conquistas.length})</h3>
                    <div class="grid grid-cols-1 gap-2 max-h-40 overflow-y-auto">
                        ${p.conquistas.map(c => `<div class="flex items-center gap-3 p-2 bg-gray-800 rounded border border-gray-700"><i class="fas ${c.icon} text-yellow-500"></i><div><div class="font-bold text-sm">${c.nome}</div><div class="text-xs text-gray-400">${c.desc}</div></div></div>`).join('')}
                    </div>
                </div>
            </div>`;
        document.getElementById('player-modal').classList.add('show');
    };

    window.openMatchModal = (date) => {
        const m = allMatchesData.filter(x => x.dataJogo === date);
        const played = m.some(x=>x.jogoAconteceu);
        
        const best = (pos, n) => m.filter(x=>x.posicao===pos).sort((a,b)=>b.notaPartida-a.notaPartida).slice(0,n);
        const sq = { gol:best('gol',1)[0], zag:best('zag',1)[0], ala:best('ala',2), mei:best('mei',1)[0], ata:best('ata',2) };
        
        // CORREÇÃO: Nome completo no modal da partida
        const pHTML = (p) => !p ? '<div class="w-12"></div>' : `<div class="flex flex-col items-center w-16"><img src="${PHOTOS[p.nome]||''}" class="w-10 h-10 rounded-full bg-gray-700"><span class="text-[9px] bg-black px-1 rounded text-white mt-1 leading-tight text-center w-full break-words">${p.nomeRaw}</span></div>`;

        const tHtml = (t) => `<div class="bg-gray-800 p-3 rounded"><h4 class="font-bold text-center border-b border-gray-600 pb-1 mb-2">${t}</h4>${m.filter(x=>x.time.toUpperCase()===t).map(x=>`<div class="flex justify-between text-xs py-1"><span>${x.nomeRaw}</span><span class="${x.notaPartida>=8?'text-green-400':''}">${x.notaPartida.toFixed(1)}</span></div>`).join('')}</div>`;

        document.getElementById('match-modal-content').innerHTML = `
            <h2 class="text-xl font-bold text-center mb-4 text-white">Partida ${date}</h2>
            <div class="grid grid-cols-2 gap-4 mb-6">${tHtml('BOCA')}${tHtml('RIVER')}</div>
            ${played ? `<div class="soccer-field h-[300px] rounded-lg flex flex-col justify-around py-2 relative shadow-inner mx-auto max-w-md">
                <div class="flex justify-center gap-8 relative z-10">${sq.ata.map(pHTML).join('')}</div>
                <div class="flex justify-center relative z-10">${[sq.mei].map(pHTML).join('')}</div>
                <div class="flex justify-center gap-12 relative z-10">${sq.ala.map(pHTML).join('')}</div>
                <div class="flex justify-center relative z-10">${[sq.zag].map(pHTML).join('')}</div>
                <div class="flex justify-center relative z-10">${[sq.gol].map(pHTML).join('')}</div>
            </div>` : ''}`;
        document.getElementById('match-modal').classList.add('show');
    };

    window.openFullRanking = (title, key, unit, isGoalie) => {
        document.getElementById('ranking-modal-title').innerText = title;
        let list = allPlayersData;
        const month = document.getElementById('month-filter').value;
        if(month !== 'all' && month !== 'Geral') {
            const matches = allMatchesData.filter(m => m.dataJogo.slice(3) === month);
            list = recalculateStats(allPlayersData, matches);
        }
        if(isGoalie) list = list.filter(p => p.jogosGoleiro > 0 && p.mediaGolsSofridos !== undefined);
        if(key === 'timeDaSemanaCount') list = list.filter(p => p.timeDaSemanaCount > 0);

        list.sort((a,b) => {
            if(key==='mediaGolsSofridos') return a[key]-b[key];
            return b[key]-a[key];
        });

        document.getElementById('ranking-modal-content').innerHTML = `<table class="w-full text-left border-collapse text-sm"><thead class="bg-gray-800 text-gray-400 sticky top-0"><tr><th class="p-3">#</th><th class="p-3">Jogador</th><th class="p-3 text-right">Val</th></tr></thead><tbody>${list.map((p,i) => `<tr class="border-b border-gray-700 hover:bg-white/5"><td class="p-3 font-bold">${i+1}</td><td class="p-3 flex items-center gap-2"><img src="${PHOTOS[p.nome]||''}" class="w-6 h-6 rounded-full bg-gray-600">${p.nomeOriginal}</td><td class="p-3 text-right font-bold text-blue-400">${format(p[key], unit==='%'?'pct':(key==='notaGeral'||key==='mediaGolsSofridos'?'dec':''))}</td></tr>`).join('')}</tbody></table>`;
        document.getElementById('ranking-modal').classList.add('show');
    };

    loadData();
</script>
</body>
</html>
