<!DOCTYPE html>

    <style>
        /* --- GLASSMORPHISM & VISUAL --- */
        :root {
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #3b82f6;
            --neon-gold: #fbbf24;
            --card-gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --card-blue: linear-gradient(135deg, #1e3a8a, #3b82f6, #60a5fa);
            --card-silver: linear-gradient(135deg, #d1d5db, #f3f4f6, #9ca3af);
            --card-green: linear-gradient(135deg, #064e3b, #10b981, #34d399);
        }

        body {
            background: radial-gradient(circle at top left, #1a202c, #000000);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Fundo animado */
        .bg-animated {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Componentes Glass */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* FIFA Card Styles */
        .fut-card {
            font-family: 'Rajdhani', sans-serif;
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
            clip-path: polygon(15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%);
        }
        .fut-card:hover { transform: scale(1.05); z-index: 10; }
        
        .card-bg-lenda { background: var(--card-gold); color: #422006; border: 2px solid #fbbf24; }
        .card-bg-craque { background: var(--card-blue); color: white; border: 2px solid #60a5fa; }
        .card-bg-diferenciado { background: var(--card-green); color: white; border: 2px solid #34d399; }
        .card-bg-comum { background: var(--card-silver); color: #1f2937; border: 2px solid #9ca3af; }

        .fut-stat-row { display: flex; justify-content: space-between; padding: 0 10%; font-weight: 700; font-size: 0.8rem; }
        .fut-player-img { mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }

        /* Utilitários */
        .text-glow { text-shadow: 0 0 10px rgba(59, 130, 246, 0.7); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* Loading Animation */
        .loader-spin { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .fut-card { clip-path: none; border-radius: 8px; aspect-ratio: auto; padding-bottom: 10px; }
            .fut-player-img { width: 60px; height: 60px; border-radius: 50%; mask-image: none; margin: 0 auto; }
            .mobile-row-card { display: flex; align-items: center; padding: 10px; }
            .mobile-stats-hidden { display: none; }
        }
    </style>
</head>

<script>
// =========================================================================

// =========================================================================
const CONFIG = {

// Mapeamento de Fotos - Atualize as URLs aqui conforme sua pasta do Drive
// Para usar drive, use links diretos ou serviços de hospedagem de imagem.
// Exemplo com link ficticio para estrutura.
const playerPhotos = {

    "FRANCISCO CHICO": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/FRANCISCO%20CHICO.jpg", 
    "PEDRALLI": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/PEDRALLI.jpg", 
    "THALES RAMOS": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Thales%20Ramos.jpg", 
    "BRUNO GUIMARAES": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Bruno.jpg", 
    "EVERTON": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Everton.jpg", 
    "JUAREZ CARDOSO": "https://github.com/ittokki/Fotos-jogadores/blob/main/juarez.jpg?raw=true", 
    "CARLOS ALEXANDRE": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Carlos%20alexandre.jpg"
};

let globalData = { players: [], matches: [] };

// =========================================================================
// LÓGICA DE DADOS (MOTOR DO TANQUE)
// =========================================================================
const DataEngine = {
    async fetchAll() {
        const fetchSheet = async (range) => {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.spreadsheetId}/values/${range}?key=${CONFIG.apiKey}`;
            const res = await fetch(url);
            const json = await res.json();
            return json.values || [];
        };
        const [p1, p2] = await Promise.all([fetchSheet(CONFIG.rangePagina1), fetchSheet(CONFIG.rangePagina2)]);
        return this.processRawData(p1, p2);
    },

    normalizaNome(nome) {
        return nome ? nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").replace(/\(GOL\)/gi, "").trim().toUpperCase() : "";
    },

    processRawData(jogadoresRaw, partidasRaw) {
        // Mapa de jogadores base
        const playersMap = new Map();
        jogadoresRaw.forEach(row => {
            const nomeNorm = this.normalizaNome(row[1]);
            if (nomeNorm) playersMap.set(nomeNorm, { id: row[0], nome: nomeNorm, nomeReal: row[1], rawPos: row[2] });
        });

        // Processamento de Partidas
        const matches = partidasRaw.map(row => {
            const isGoleiro = (row[0] || "").toUpperCase().includes('(GOL)') || Number(row[3]) > 0;
            const vitoriaStatus = (row[7] || "").toLowerCase().trim();
            const pos = row[11] ? row[11].toLowerCase() : 'na';
            
            return {
                nome: this.normalizaNome(row[0]),
                gols: Number(row[1]) || 0,
                assist: Number(row[2]) || 0,
                golsSofridos: Number(row[3]) || 0,
                notaADM: Number(row[5]) || 0,
                data: row[6],
                vitoria: vitoriaStatus === 'sim' ? 1 : vitoriaStatus === 'empate' ? 0.5 : 0,
                time: row[8],
                jogou: (row[10] || "").toLowerCase() === 'sim',
                isGoleiro: isGoleiro,
                posicaoPartida: pos.includes('ata') ? 'ATA' : pos.includes('mei') ? 'MEI' : pos.includes('zag') ? 'ZAG' : pos.includes('gol') ? 'GOL' : 'ALA'
            };
        }).filter(m => m.nome && m.jogou);

        // Agregação de Stats
        const statsMap = new Map();
        
        matches.forEach(m => {
            if (!statsMap.has(m.nome)) {
                statsMap.set(m.nome, {
                    jogos: 0, gols: 0, assist: 0, vitorias: 0, golsSofridos: 0, 
                    notas: [], posicoes: {}, jogosGoleiro: 0
                });
            }
            const s = statsMap.get(m.nome);
            
            // Calculo da Nota (Lógica Antiga)
            const PESO_ADM = 5, NOTA_BASE = 6.0;
            let notaTecnica = NOTA_BASE + (m.gols * 0.7) + (m.assist * 0.6) + (m.isGoleiro ? m.golsSofridos * -0.15 : 0) + (m.golsContra * -0.7 || 0);
            let notaPonderada = (notaTecnica + (m.notaADM * PESO_ADM)) / (1 + PESO_ADM);
            let notaFinal = Math.max(0, Math.min(10, notaPonderada + (m.vitoria === 1 ? 0.3 : m.vitoria === 0.5 ? 0.15 : 0)));

            s.jogos++;
            s.gols += m.gols;
            s.assist += m.assist;
            s.vitorias += m.vitoria;
            s.golsSofridos += m.golsSofridos;
            s.notas.push(notaFinal);
            if(m.isGoleiro) s.jogosGoleiro++;
            
            // Contagem de posição dinâmica
            s.posicoes[m.posicaoPartida] = (s.posicoes[m.posicaoPartida] || 0) + 1;
            
            m.notaCalculada = notaFinal; // Salva na partida para uso posterior
        });

        // Montagem Final dos Jogadores
        const finalPlayers = [];
        playersMap.forEach((base, key) => {
            const s = statsMap.get(key);
            if (s && s.jogos > 0) {
                const media = s.notas.reduce((a,b)=>a+b,0) / s.jogos;
                
                // Determina posição mais jogada
                let mainPos = Object.keys(s.posicoes).sort((a,b) => s.posicoes[b] - s.posicoes[a])[0] || 'MEI';

                finalPlayers.push({
                    ...base,
                    ...s,
                    mediaGeral: media,
                    mediaGols: s.gols / s.jogos,
                    mediaAssist: s.assist / s.jogos,
                    posicaoPrincipal: mainPos,
                    fifa: this.calculateFIFAAttributes(media, s.gols, s.assist, s.jogos, mainPos, s.golsSofridos, s.jogosGoleiro)
                });
            }
        });

        return { players: finalPlayers, matches: matches };
    },

    calculateFIFAAttributes(media, gols, assist, jogos, pos, golsSofridos, jogosGoleiro) {
        // Algoritmo FIFA Customizado
        const ovr = Math.min(99, Math.round(media * 10)); // Ex: Nota 8.5 vira 85
        
        // Ritmo (PAC): Atacantes ganham bonus por gols, Alas por assist
        let pac = 60 + (gols/jogos * 15) + (assist/jogos * 10);
        if(pos === 'ATA' || pos === 'ALA') pac += 10;
        
        // Chute (SHO): Gols puro
        let sho = 50 + (gols/jogos * 40);
        
        // Passe (PAS): Assistencia pura
        let pas = 50 + (assist/jogos * 45);
        
        // Defesa (DEF)
        let def = 50;
        if(pos === 'GOL') def = 99 - (golsSofridos/jogosGoleiro * 10);
        else if(pos === 'ZAG') def = 70 + (media * 2);
        else def = 40 + (media);

        // Físico (PHY) - Baseado em jogos (experiência)
        let phy = 50 + Math.min(40, jogos);

        // Drible (DRI) - Baseado em nota técnica implícita
        let dri = media * 8.5;

        // Classificação da Carta
        let cardType = 'comum';
        if(ovr >= 90) cardType = 'lenda';
        else if(ovr >= 80) cardType = 'craque';
        else if(ovr >= 70) cardType = 'diferenciado';

        return {
            ovr: ovr,
            pac: Math.round(Math.min(99, pac)),
            sho: Math.round(Math.min(99, sho)),
            pas: Math.round(Math.min(99, pas)),
            dri: Math.round(Math.min(99, dri)),
            def: Math.round(Math.min(99, def)),
            phy: Math.round(Math.min(99, phy)),
            cardType: cardType
        };
    }
};

const UI = {
    init() {
        this.setupTabs();

        const tabs = [

            { id: 'partidas', icon: 'fa-history', label: 'Partidas' },
            { id: 'graficos', icon: 'fa-chart-pie', label: 'Estatísticas' }
        ];
        
        const container = document.getElementById('tabs-container');
        tabs.forEach(t => {
            const btn = document.createElement('button');
            btn.className = `tab-btn px-6 py-3 rounded-xl flex items-center gap-2 text-sm font-bold transition ${t.id === 'rankings' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`;

            btn.onclick = () => this.switchTab(t.id, btn);

                            <div class="text-left">

                                <div class="fut-stat-row"><span>${stats.sho}</span> <span class="opacity-60 font-normal">SHO</span></div>
                                <div class="fut-stat-row"><span>${stats.def}</span> <span class="opacity-60 font-normal">DEF</span></div>
                                <div class="fut-stat-row"><span>${stats.pas}</span> <span class="opacity-60 font-normal">PAS</span></div>
                                <div class="fut-stat-row"><span>${stats.phy}</span> <span class="opacity-60 font-normal">PHY</span></div>
                            </div>

    populateSnakeDraft(players) {
        const pool = document.getElementById('draft-pool');
        pool.innerHTML = '';
        
        // Ordena alfabeticamente para facilitar a busca
        const sorted = [...players].sort((a,b) => a.nomeReal.localeCompare(b.nomeReal));
        
        sorted.forEach(p => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-2 hover:bg-white/5 rounded cursor-pointer border border-transparent hover:border-blue-500/30 transition";

                    <img src="${playerPhotos[p.nome] || 'https://ui-avatars.com/api/?name='+p.nome}" class="w-8 h-8 rounded-full object-cover">
                    <div>
                        <p class="font-bold text-sm">${p.nomeReal}</p>
                        <p class="text-xs text-gray-400">OVR: ${p.fifa.ovr} | ${p.posicaoPrincipal}</p>

            Array.from(pool.children).forEach(row => {

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

};

// =========================================================================
// SISTEMA SNAKE DRAFT & IA VERDICT
// =========================================================================
const draftSystem = {
    runSnakeDraft() {
        // 1. Pegar selecionados
        const checkboxes = document.querySelectorAll('.draft-check:checked');
        const selectedNames = Array.from(checkboxes).map(c => c.value);
        
        if(selectedNames.length < 2) return alert("Selecione pelo menos 2 jogadores.");

        // 2. Recuperar objetos completos e ordenar por OVR
        const pool = globalData.players
            .filter(p => selectedNames.includes(p.nome))
            .sort((a,b) => b.fifa.ovr - a.fifa.ovr); // O melhor primeiro

        // 3. Distribuição Snake (A, B, B, A, A, B...)
        const teamA = [];
        const teamB = [];
        
        pool.forEach((player, index) => {
            // Lógica Snake: 0->A, 1->B, 2->B, 3->A, 4->A, 5->B...
            // Padrão repete a cada 4: A, B, B, A
            const cycle = index % 4;
            if (cycle === 0 || cycle === 3) {
                teamA.push(player);
            } else {
                teamB.push(player);
            }
        });

        this.renderTeams(teamA, teamB);
        this.runAIVerdict(teamA, teamB);
    },

    renderTeams(teamA, teamB) {
        const renderList = (team, containerId, scoreId) => {
            const ul = document.getElementById(containerId);
            ul.innerHTML = '';
            let totalOvr = 0;
            
            team.forEach(p => {
                totalOvr += p.fifa.ovr;
                ul.innerHTML += `
                    <li class="flex justify-between items-center bg-black/20 p-2 rounded">
                        <div class="flex items-center gap-2">
                            <div class="text-xs font-bold w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center">${p.fifa.ovr}</div>
                            <span>${p.nomeReal}</span>
                        </div>
                        <span class="text-xs text-gray-400">${p.posicaoPrincipal}</span>
                    </li>
                `;
            });
            
            const avg = Math.round(totalOvr / team.length);
            document.getElementById(scoreId).innerText = `Média OVR: ${avg}`;
            return { avg, totalGoals: team.reduce((a,b) => a + b.gols, 0) };
        };

        this.statsA = renderList(teamA, 'list-team-a', 'score-team-a');
        this.statsB = renderList(teamB, 'list-team-b', 'score-team-b');
    },

    runAIVerdict(teamA, teamB) {
        const panel = document.getElementById('ia-verdict');
        panel.classList.remove('hidden');
        panel.classList.add('animate-pulse'); // Efeito de processando

        setTimeout(() => {
            panel.classList.remove('animate-pulse');
            
            const statsA = this.statsA;
            const statsB = this.statsB;

            // Analise
            const techWinner = statsA.avg > statsB.avg ? "TIME A" : statsA.avg < statsB.avg ? "TIME B" : "EMPATE";
            const goalsWinner = statsA.totalGoals > statsB.totalGoals ? "TIME A" : statsA.totalGoals < statsB.totalGoals ? "TIME B" : "EMPATE";

            document.getElementById('verdict-fav-tech').innerText = techWinner;
            document.getElementById('verdict-fav-goals').innerText = goalsWinner;

            // Texto gerado
            let text = "";
            if (techWinner === goalsWinner && techWinner !== "EMPATE") {
                text = `O ${techWinner} é o favorito absoluto. Possui tecnicamente os melhores jogadores e maior histórico de gols.`;
            } else if (techWinner === "EMPATE") {
                text = "Equilíbrio total. O Snake Draft funcionou perfeitamente.";
            } else {
                text = `Jogo interessante! O ${techWinner} tem mais técnica (OVR), mas o ${goalsWinner} tem mais faro de gol. A partida será decidida na defesa.`;
            }
            document.getElementById('verdict-text').innerText = text;

        }, 1500);
    }
};
