    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* FIFA Card Styles */
        .fut-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .fut-card.gold { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); color: #422a02; }
        .fut-card.silver { background: linear-gradient(135deg, #e0e0e0, #ffffff, #a0a0a0); color: #333; }
        .fut-card.bronze { background: linear-gradient(135deg, #cd7f32, #ffcba4, #8b4513); color: #3e2723; }
        .fut-card.special { background: linear-gradient(135deg, #1a237e, #0d47a1, #2962ff); color: white; border: 1px solid #4fc3f7; }
        
        .fut-stat-box { font-family: 'Rajdhani', sans-serif; font-weight: 700; text-align: center; }
        
        /* Mobile Adaptations */
        .mobile-mode .grid-cols-4 { grid-template-columns: 1fr; }
        .mobile-mode #rankings-grid { display: flex; flex-direction: column; gap: 1rem; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .active-tab {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-bottom: 2px solid #60a5fa;
        }
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // === CONFIGURAÇÃO E DADOS ===
    const apiKey = "AIzaSyCL19ds6YqVOv5vV-zygBjeC-byy-rDPfM";
    const spreadsheetId = "1TvrVT8ksYYMlpw8gkKIFvpnnCf02J8uYTkhHc5c0vdo";
    const rangePagina1 = "Página1!A2:H100";
    const rangePagina2 = "Página2!A2:L300";

    // *** COLOQUE AQUI OS LINKS DAS NOVAS FOTOS ***
    // Se o nome no Google Sheets for "HENRIQUE", a chave deve ser "HENRIQUE".
    const playerPhotos = {
        "HENRIQUE AMARAL": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/henrique.jpg",
        "VITOR": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Vitor%20gol.jpg",
        "MARCO DAITX": "https://raw.githubusercontent.com/ittokki/Fotos-jogadores/refs/heads/main/Marco.jpg",
        // ... Mantenha o restante ou atualize conforme necessário.
        // O código usará um Avatar Genérico se a foto não carregar ou não existir aqui.
    };

    let allPlayersData = [];
    let allMatchesData = [];
    let chartInstances = {};
    let selecaoMesFilterInitialized = false;

    // --- UTILS ---
    const parseNum = (val) => typeof val === "number" ? val : (Number(val?.toString().replace(',', '.').trim()) || 0);
    const normalizaNome = (nome) => nome ? nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").replace(/\(GOL\)/gi, "").trim().toUpperCase() : '';
    const mapPosition = (pos) => {
        if (!pos) return 'N/A';
        const p = pos.toLowerCase();
        if (p.includes('ata')) return 'ata';
        if (p.includes('mei')) return 'mei';
        if (p.includes('ala')) return 'ala';
        if (p.includes('zag')) return 'zag';
        if (p.includes('gol')) return 'gol';
        return 'N/A';
    };

    // --- FIFA CARD LOGIC ---
    function calculateFIFAStats(player) {
        // Base Overal calculation (x10 original note)
        let ovr = Math.min(99, Math.round(player.notaGeral * 10));
        if (player.jogos < 3) ovr = 60; // Penalty for low games

        // Position Bonuses
        let pac = 70; let sho = 60; let pas = 60; let def = 50; let phy = 70;

        // Dynamic Calculation based on real stats
        const gpg = player.gols / (player.jogos || 1); // Goals per game
        const apg = player.assistencias / (player.jogos || 1); // Assists per game
        
        // SHO (Shooting)
        sho += Math.min(39, (gpg * 30)); 
        
        // PAS (Passing)
        pas += Math.min(39, (apg * 40));

        // PAC (Pace - participation + role)
        const participation = player.jogos; // more games = more rhythm
        pac += Math.min(20, participation);
        if (player.posicaoPref === 'ata' || player.posicaoPref === 'ala') pac += 9;

        // DEF (Defense)
        if (player.posicaoPref === 'zag' || player.posicaoPref === 'gol') {
            def = 80 + (player.notaGeral * 1.5);
        } else if (player.posicaoPref === 'ata') {
            def = 40;
        }

        // Clamp values 1-99
        const clamp = (n) => Math.max(1, Math.min(99, Math.round(n)));
        
        return {
            ovr: clamp(ovr),
            pac: clamp(pac),
            sho: clamp(sho),
            pas: clamp(pas),
            def: clamp(def),
            phy: clamp(phy + (player.jogos / 2)),
            cardType: ovr >= 90 ? 'special' : (ovr >= 80 ? 'gold' : (ovr >= 70 ? 'silver' : 'bronze'))
        };
    }

    // --- DATA FETCHING ---
    async function fetchSheetData(range) {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
        const res = await fetch(url);
        const data = await res.json();
        return data.values || [];
    }

    async function initData() {
        try {
            const [partidasRaw, jogadoresRaw] = await Promise.all([fetchSheetData(rangePagina2), fetchSheetData(rangePagina1)]);
            
            // Process Matches
            allMatchesData = partidasRaw.map(row => ({
                nome: normalizaNome(row[0]), nomeRaw: row[0],
                gols: parseNum(row[1]), assistencias: parseNum(row[2]),
                golsTomados: parseNum(row[3]), golsContra: parseNum(row[4]),
                notaADM: parseNum(row[5]), dataJogo: row[6],
                vitoria: (row[7]||"").toLowerCase().trim() === 'sim' ? 1 : (row[7]||"").toLowerCase().trim() === 'empate' ? 0.5 : 0,
                time: row[8] || 'N/A',
                jogoAconteceu: (row[10] || "").toLowerCase() === 'sim',
                isGoleiro: (row[0] || "").toUpperCase().includes('(GOL)') || parseNum(row[3]) > 0,
                posicao: mapPosition(row[11])
            })).filter(p => p.nome && /^\d{2}\/\d{2}\/\d{4}$/.test(p.dataJogo));

            // Calculate Match Ratings
            allMatchesData.forEach(p => {
                if(p.jogoAconteceu) {
                    const base = 6.0 + (p.gols * 0.7) + (p.assistencias * 0.6) + (p.isGoleiro ? p.golsTomados * -0.15 : 0) + (p.golsContra * -0.7);
                    let ponderada = (base + (p.notaADM * 5)) / 6;
                    p.notaPartida = Math.max(0, Math.min(10, ponderada + (p.vitoria === 1 ? 0.3 : p.vitoria === 0.5 ? 0.15 : 0)));
                } else p.notaPartida = 0;
            });

            // Process Players (Aggregation)
            const playerMap = new Map();
            jogadoresRaw.forEach(r => { 
                const n = normalizaNome(r[1]); 
                if(n) playerMap.set(n, { nome: n, nomeOriginal: r[1], stats: { jogos:0, gols:0, ass:0, notas:[], posicoes:[] } }); 
            });

            allMatchesData.forEach(m => {
                if(m.jogoAconteceu && playerMap.has(m.nome)) {
                    const p = playerMap.get(m.nome);
                    p.stats.jogos++; p.stats.gols+=m.gols; p.stats.ass+=m.assistencias;
                    p.stats.notas.push(m.notaPartida);
                    p.stats.posicoes.push(m.posicao);
                    
                    // Track goals conceded for GK ranking
                    if(m.isGoleiro) {
                        p.stats.jogosGol = (p.stats.jogosGol || 0) + 1;
                        p.stats.golsTomados = (p.stats.golsTomados || 0) + m.golsTomados;
                    }
                    
                    // Add match to history
                    if(!p.partidas) p.partidas = [];
                    p.partidas.push(m);
                }
            });

            // Finalize Player Objects
            allPlayersData = Array.from(playerMap.values()).map(p => {
                const notas = p.stats.notas;
                const notaGeral = notas.length ? notas.reduce((a,b)=>a+b,0)/notas.length : 0;
                
                // Determine preferred position
                const posCount = p.stats.posicoes.reduce((acc, pos) => { acc[pos] = (acc[pos] || 0) + 1; return acc; }, {});
                const primaryPos = Object.keys(posCount).sort((a, b) => posCount[b] - posCount[a])[0] || 'N/A';

                // Base object
                const playerObj = {
                    nome: p.nome,
                    nomeOriginal: p.nomeOriginal,
                    jogos: p.stats.jogos,
                    gols: p.stats.gols,
                    assistencias: p.stats.ass,
                    notaGeral: notaGeral,
                    posicaoPref: primaryPos,
                    partidas: p.partidas || [],
                    mediaGolsSofridos: p.stats.jogosGol > 0 ? (p.stats.golsTomados / p.stats.jogosGol) : 99,
                    jogosGoleiro: p.stats.jogosGol || 0,
                    nivel: notaGeral >= 9 ? 'Lenda' : notaGeral >= 8 ? 'Craque' : notaGeral >= 7 ? 'Diferenciado' : notaGeral >= 6 ? 'Esforçado' : 'Iniciante',
                    conquistas: [] // Logic omitted for brevity, assumed reused from old code if needed
                };

                // Add FIFA Stats
                playerObj.fifa = calculateFIFAStats(playerObj);
                
                // Add Selection Count (Logic simplified)
                // (Assuming you have logic to count selections, adding mock for demo)
                playerObj.timeDaSemanaCount = 0; 
                
                return playerObj;
            }).filter(p => p.jogos > 0);

            // Calc Rankings
            renderUI();

        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = `<div class="text-red-500 text-center"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Erro ao carregar.<br>${e.message}</div>`;
        }
    }

    // --- RENDER UI ---
    function renderUI() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app-container').classList.remove('hidden');
        
        renderCards();
        renderSpecialRankings();
        renderBalancerList();
    }

    function renderCards() {
        const container = document.getElementById('cards-display-area');
        container.innerHTML = '';
        
        // Sort by OVR
        const sorted = [...allPlayersData].sort((a,b) => b.fifa.ovr - a.fifa.ovr).slice(0, 8); // Top 8 cards

        sorted.forEach(p => {
            const photoUrl = playerPhotos[p.nome] || `https://ui-avatars.com/api/?name=${p.nome.replace(' ','+')}&background=random`;
            const stats = p.fifa;
            
            const cardHTML = `
                <div class="fut-card ${stats.cardType} cursor-pointer hover:scale-105" onclick="showPlayerModal('${p.nome}')">
                    <div class="absolute top-2 left-3 text-${stats.cardType === 'gold' ? 'yellow-900' : 'gray-800'}">
                        <div class="text-3xl font-bold leading-none font-fifa">${stats.ovr}</div>
                        <div class="text-xs font-bold uppercase">${p.posicaoPref.substring(0,3)}</div>
                    </div>
                    
                    <div class="absolute top-8 left-1/2 -translate-x-1/2 w-24 h-24">
                        <img src="${photoUrl}" class="w-full h-full object-cover rounded-full border-2 border-white/30 shadow-lg">
                    </div>
                    
                    <div class="absolute top-32 w-full text-center">
                        <div class="font-fifa font-bold text-lg uppercase truncate px-2 text-shadow">${p.nomeOriginal.split(' ')[0]}</div>
                        <div class="w-3/4 h-px bg-current mx-auto opacity-50 my-1"></div>
                    </div>
                    
                    <div class="absolute bottom-3 w-full px-4 grid grid-cols-2 gap-x-2 gap-y-0 text-xs leading-tight opacity-90 font-fifa">
                        <div class="flex justify-between"><span>${stats.pac} PAC</span></div>
                        <div class="flex justify-between"><span>${p.jogos} JOG</span></div>
                        <div class="flex justify-between"><span>${stats.sho} SHO</span></div>
                        <div class="flex justify-between"><span>${stats.def} DEF</span></div>
                        <div class="flex justify-between"><span>${stats.pas} PAS</span></div>
                        <div class="flex justify-between"><span>${stats.phy} PHY</span></div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function renderSpecialRankings() {
        // Rei da Semana (Mock logic - needs historical parsing for accuracy)
        const rei = [...allPlayersData].sort((a,b) => b.jogos - a.jogos)[0]; // Placeholder logic
        document.getElementById('ranking-rei-semana').innerHTML = `
            <h4 class="text-yellow-400 font-bold mb-2"><i class="fas fa-crown mr-2"></i>Rei da Constância (Fominha)</h4>
            <div class="flex items-center gap-3">
                <img src="${playerPhotos[rei.nome] || ''}" class="w-12 h-12 rounded-full border-2 border-yellow-400" onerror="this.src='https://ui-avatars.com/api/?name=${rei.nome}'">
                <div>
                    <p class="font-bold text-white">${rei.nomeOriginal}</p>
                    <p class="text-sm text-gray-400">${rei.jogos} Jogos disputados</p>
                </div>
            </div>
        `;

        // Paredão
        const goleiros = allPlayersData.filter(p => p.jogosGoleiro >= 3).sort((a,b) => a.mediaGolsSofridos - b.mediaGolsSofridos);
        if(goleiros.length > 0) {
            const paredao = goleiros[0];
            document.getElementById('ranking-paredao').innerHTML = `
                <h4 class="text-blue-400 font-bold mb-2"><i class="fas fa-hand-paper mr-2"></i>Paredão (Goleiro)</h4>
                <div class="flex items-center gap-3">
                    <img src="${playerPhotos[paredao.nome] || ''}" class="w-12 h-12 rounded-full border-2 border-blue-400" onerror="this.src='https://ui-avatars.com/api/?name=${paredao.nome}'">
                    <div>
                        <p class="font-bold text-white">${paredao.nomeOriginal}</p>
                        <p class="text-sm text-gray-400">Média ${paredao.mediaGolsSofridos.toFixed(2)} gols/jogo</p>
                    </div>
                </div>
            `;
        }
    }

    // --- TEAM BALANCER LOGIC (SNAKE DRAFT) ---
    function renderBalancerList() {
        const list = document.getElementById('balancer-player-list');
        list.innerHTML = allPlayersData.sort((a,b) => a.nomeOriginal.localeCompare(b.nomeOriginal)).map(p => `
            <div class="flex items-center justify-between p-2 hover:bg-white/5 rounded cursor-pointer" onclick="this.querySelector('input').click()">
                <div class="flex items-center gap-3">
                    <input type="checkbox" value="${p.nome}" class="balancer-check w-4 h-4 rounded border-gray-500 bg-transparent focus:ring-blue-500">
                    <img src="${playerPhotos[p.nome] || ''}" class="w-8 h-8 rounded-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${p.nome}'">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-white">${p.nomeOriginal}</span>
                        <span class="text-[10px] text-gray-400">OVR: ${p.fifa.ovr}</span>
                    </div>
                </div>
                <span class="text-xs font-bold text-yellow-500">${p.fifa.ovr}</span>
            </div>
        `).join('');

        // Update count
        const updateCount = () => {
            const count = document.querySelectorAll('.balancer-check:checked').length;
            document.getElementById('selected-count').innerText = `${count} selecionados`;
        };
        document.querySelectorAll('.balancer-check').forEach(c => c.addEventListener('change', updateCount));
        
        document.getElementById('select-all-btn').onclick = () => {
            document.querySelectorAll('.balancer-check').forEach(c => c.checked = true);
            updateCount();
        }
    }

    document.getElementById('generate-teams-btn').onclick = () => {
        const selectedNames = Array.from(document.querySelectorAll('.balancer-check:checked')).map(cb => cb.value);
        if(selectedNames.length < 2) return alert("Selecione pelo menos 2 jogadores.");

        const pool = allPlayersData.filter(p => selectedNames.includes(p.nome)).sort((a,b) => b.fifa.ovr - a.fifa.ovr);
        
        // SNAKE DRAFT: A -> B -> B -> A -> A -> B ...
        const teamA = [];
        const teamB = [];
        
        pool.forEach((p, i) => {
            if (i % 4 === 0 || i % 4 === 3) teamA.push(p);
            else teamB.push(p);
        });

        // Calculations
        const statsA = calcTeamStats(teamA);
        const statsB = calcTeamStats(teamB);

        // Render Lists
        const renderList = (team) => team.map(p => `
            <div class="flex justify-between items-center text-sm border-b border-white/5 py-1">
                <span class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full ${p.fifa.ovr >= 80 ? 'bg-yellow-400' : 'bg-gray-400'}"></div>
                    ${p.nomeOriginal}
                </span>
                <span class="font-mono opacity-70">${p.fifa.ovr}</span>
            </div>`).join('');

        document.getElementById('team-a-list').innerHTML = renderList(teamA);
        document.getElementById('team-b-list').innerHTML = renderList(teamB);
        document.getElementById('team-a-stats').innerText = `OVR Médio: ${statsA.avgOvr} | Gols Totais: ${statsA.totalGoals}`;
        document.getElementById('team-b-stats').innerText = `OVR Médio: ${statsB.avgOvr} | Gols Totais: ${statsB.totalGoals}`;

        // VERDICT AI
        let verdict = "";
        const diffOvr = (statsA.avgOvr - statsB.avgOvr).toFixed(1);
        
        if (Math.abs(diffOvr) < 2) {
            verdict = `O jogo promete ser <b>extremamente equilibrado</b>. A diferença técnica é mínima. `;
            if (statsA.totalGoals > statsB.totalGoals) verdict += `Porém, o <b>Time A</b> tem um poder de fogo histórico maior (${statsA.totalGoals} gols), o que pode decidir nos detalhes.`;
            else verdict += `Entretanto, o <b>Time B</b> tem jogadores com mais gols na bagagem, indicando um ataque mais letal.`;
        } else {
            const favorite = statsA.avgOvr > statsB.avgOvr ? "Time A" : "Time B";
            verdict = `O <b>${favorite}</b> entra como favorito técnico (OVR +${Math.abs(diffOvr)}). A distribuição Snake tentou equilibrar, mas as peças individuais deste time estão em melhor fase. O outro time precisará jogar na defesa e contra-ataque.`;
        }

        document.getElementById('verdict-content').innerHTML = verdict;
        document.getElementById('verdict-panel').classList.remove('hidden');
        document.getElementById('teams-result').classList.remove('hidden');
        document.getElementById('teams-result').classList.add('grid');
    };

    function calcTeamStats(team) {
        if (!team.length) return { avgOvr: 0, totalGoals: 0 };
        const totalOvr = team.reduce((acc, p) => acc + p.fifa.ovr, 0);
        const totalGoals = team.reduce((acc, p) => acc + p.gols, 0);
        return { avgOvr: (totalOvr / team.length).toFixed(1), totalGoals };
    }

    // --- TAB SWITCHING ---
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
            document.getElementById(btn.dataset.tab).classList.remove('hidden');
        });
    });

    // --- MODAL ---
    window.showPlayerModal = (playerName) => {
        const player = allPlayersData.find(p => p.nome === playerName);
        if(!player) return;
        
        // Populate modal with detailed stats using glass style
        const modal = document.getElementById('modal-content');
        modal.innerHTML = `
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex justify-center">
                    <div class="fut-card ${player.fifa.cardType} gold shadow-2xl" style="max-width:250px;">
                        <div class="absolute top-4 left-4 text-3xl font-bold font-fifa">${player.fifa.ovr}</div>
                        <div class="absolute top-12 left-1/2 -translate-x-1/2 w-32 h-32">
                             <img src="${playerPhotos[player.nome] || ''}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://ui-avatars.com/api/?name=${player.nome}'">
                        </div>
                        <div class="absolute top-48 w-full text-center font-bold font-fifa text-2xl uppercase">${player.nomeOriginal.split(' ')[0]}</div>
                    </div>
                </div>
                <div class="w-full md:w-2/3 text-white">
                    <h2 class="text-3xl font-bold mb-2">${player.nomeOriginal}</h2>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="glass-card p-3 rounded">
                            <span class="text-gray-400 text-xs block">JOGOS</span>
                            <span class="text-xl font-bold">${player.jogos}</span>
                        </div>
                        <div class="glass-card p-3 rounded">
                            <span class="text-gray-400 text-xs block">GOLS</span>
                            <span class="text-xl font-bold">${player.gols}</span>
                        </div>
                         <div class="glass-card p-3 rounded">
                            <span class="text-gray-400 text-xs block">NOTA MÉDIA</span>
                            <span class="text-xl font-bold text-blue-400">${player.notaGeral.toFixed(2)}</span>
                        </div>
                         <div class="glass-card p-3 rounded">
                            <span class="text-gray-400 text-xs block">NÍVEL</span>
                            <span class="text-xl font-bold text-yellow-400">${player.nivel}</span>
                        </div>
                    </div>
                    <h4 class="font-bold mb-2 text-purple-300">Histórico Recente</h4>
                    <div class="space-y-2 text-sm">
                        ${player.partidas.slice(-5).reverse().map(p => `
                            <div class="flex justify-between border-b border-white/10 pb-1">
                                <span>${p.dataJogo}</span>
                                <span class="${p.notaPartida >= 8 ? 'text-green-400' : 'text-gray-300'} font-bold">${p.notaPartida.toFixed(1)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
        document.getElementById('main-modal').classList.remove('hidden');
        document.getElementById('main-modal').classList.add('flex');
    }
    
    document.getElementById('modal-close-button').onclick = () => {
        document.getElementById('main-modal').classList.add('hidden');
        document.getElementById('main-modal').classList.remove('flex');
    }

    // Inicialização
    initData();
});
</script>
</body>
</html>
